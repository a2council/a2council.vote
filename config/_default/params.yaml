hugoblox:
  schema: "2.0"

  identity:
    name: "a2council.vote"
    organization: "a2council.vote contributors"
    type: organization
    description: "Ann Arbor City Council Voting Charts Project"
    social:
      twitter: "bdimcheff"

  theme:
    mode: system
    pack: "default"

  typography:
    pack: "humanist"

  layout:
    radius: "md"
    spacing: "comfortable"
    avatar_shape: circle

  header:
    enable: true
    style: navbar
    sticky: true
    align: right
    search: true
    theme_toggle: true
    theme_picker: false
    language_switcher: false

  footer:
    style: minimal
    language_switcher: false

  copyright:
    notice: "© {year} {name}. This work is licensed under {license}"
    license:
      type: cc
      allow_derivatives: true
      share_alike: true
      allow_commercial: false

  content:
    math:
      enable: false
    toc:
      enable: false
    reading_time:
      enable: false

  search:
    enable: true

  comments:
    enable: false

  repository:
    enable: true
    url: "https://github.com/a2council/a2council.vote"
    branch: main
    content_dir: content

  locale:
    date_format: "Jan 2, 2006"
    time_format: "3:04 PM"
    address_format: en-us

  pro:
    hide_attribution: false
