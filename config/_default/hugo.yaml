title: a2council.vote
baseURL: 'https://a2council.vote/'

cascade:
  - target:
      path: /post/**
      kind: page
    pager: true
    editable: true
    show_date: true
    reading_time: false
    commentable: false
    show_related: true
    show_breadcrumb: true
    share: true
    header:
      navbar:
        enable: true

defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true

build:
  writeStats: true
enableGitInfo: true
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [.ipynb$, .ipynb_checkpoints$, .Rmd$, .Rmarkdown$, _cache$]
permalinks:
  authors: '/author/:slug/'
  tags: '/tag/:slug/'
  categories: '/category/:slug/'
disableAliases: true
outputs:
  home: [HTML, RSS, JSON, WebAppManifest]
  section: [HTML, RSS]
imaging:
  resampleFilter: lanczos
  anchor: smart
  jpeg:
    quality: 75
  webp:
    quality: 75
    hint: picture
  avif:
    quality: 75
    hint: picture
timeout: 600000
taxonomies:
  tag: tags
  category: categories
  author: authors
markup:
  _merge: deep
related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 70
security:
  _merge: deep
  exec:
    allow:
      - '^(dart-)?sass$'
      - '^go$'
      - '^git$'
      - '^node$'
      - '^postcss$'
      - '^tailwindcss$'
sitemap:
  _merge: deep
minify:
  _merge: deep
